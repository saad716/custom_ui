const mobile=()=>innerWidth<=768;
if(PV)html.classList.add('pv');

const ICON={sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.2-4.4A8 8 0 1 1 21 12z"/>',headset:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20a4 4 0 0 1-4 2h-2"/>',sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'};
const svg=(p,st)=>'<svg class="li" viewBox="0 0 24 24" fill="none" stroke="'+st+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const avatar=()=>C.logoUrl?'<img src="'+esc(C.logoUrl)+'" alt="">':svg(ICON.sun,'#fff').replace(' class="li"','');
const contrast=h=>{const n=parseInt(String(h).replace('#','').padEnd(6,'0').slice(0,6),16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>165?'#1d1d2b':'#fff'};
const loaded={};
const css=u=>{if(!u||loaded[u])return;loaded[u]=1;const l=document.createElement('link');l.rel='stylesheet';l.href=u;document.head.appendChild(l)};

function apply(){
  const c=C,k=c.colors,R=({sharp:[4,3,2,8],soft:[18,14,10,50],round:[26,20,14,50]})[c.corners]||[18,14,10,50],solid=c.gradient===false;
  const v={'--c1':k.primary,'--c2':k.secondary,'--accent':k.accent,'--accent2':k.accent2,'--ink':k.ink,'--muted':k.muted,'--surface':k.surface,'--bubble':k.bubble,'--line':k.line,
    '--font':"'"+(c.font||'Inter')+"',-apple-system,BlinkMacSystemFont,sans-serif",'--r1':R[0]+'px','--r2':R[1]+'px','--r3':R[2]+'px','--rp':R[3]+'px',
    '--grad':solid?'var(--accent)':'linear-gradient(135deg,var(--accent),var(--accent2))','--hgrad':solid?'var(--c1)':'linear-gradient(135deg,var(--c1),var(--c2))',
    '--on':contrast(k.accent),'--pd':(c.pillDelaySec==null?0.6:c.pillDelaySec)+'s'};
  [L,P].forEach(el=>{for(const n in v)el.style.setProperty(n,v[n]);el.classList.toggle('L',c.position==='left')});
  css(c.fontUrl||'https://fonts.googleapis.com/css2?family='+encodeURIComponent(c.font||'Inter').replace(/%20/g,'+')+':wght@300;400;500;600;700;800&display=swap');
  $('hdr-company-name').textContent=c.companyName;$('hdr-agent-tag').textContent=c.agentTag;$('hdr-online').textContent=c.onlineLabel;
  $('hdr-avatar-box').innerHTML=avatar();$('pill-title').textContent=c.launcherTitle;$('pill-sub').textContent=c.launcherSub;
  $('livePill').style.display=c.showPill?'':'none';$('launcherBadge').style.display=(c.showBadge&&!opened)?'':'none';
  $('inp').placeholder=c.inputPlaceholder;$('inp-footer-text').textContent=c.footerText||c.companyName+' · '+c.agentTag;
  $('powered').style.display=c.showPoweredBy?'':'none';
  $('powered').innerHTML=esc(c.poweredText)+' <a href="'+esc(c.poweredUrl)+'" target="_blank" rel="noopener">'+esc(c.poweredLabel)+'</a>';
  const tb=$('trust-bar');tb.style.display=c.trustBadges.length?'':'none';
  tb.innerHTML=c.trustBadges.map((b,i)=>'<div class="sub-item'+(i?'':' star')+'">'+esc(b)+'</div>').join('');
  const lb=$('launcherBtn');lb.querySelectorAll('.li').forEach(x=>x.remove());
  lb.insertAdjacentHTML('beforeend',(c.launcherIcon==='custom'&&c.launcherIconUrl)?'<img class="li" src="'+esc(c.launcherIconUrl)+'" alt="">':svg(ICON[c.launcherIcon]||ICON.sun,'currentColor').replace('stroke="currentColor"',''));
  wire(document);
}
function wire(root){root.querySelectorAll('img:not([data-w])').forEach(i=>{i.dataset.w=1;i.addEventListener('error',()=>{const w=i.closest('.tour-img-wrap');if(w)w.innerHTML='<div class="no-photo">No photo available</div>';else if(i.classList.contains('tour-modal-img'))i.style.display='none';else i.remove()})})}

/* open / close */
function lock(){savedY=scrollY||0;html.classList.add('by-lock');document.body.classList.add('by-lock');document.body.style.top='-'+savedY+'px'}
function unlock(){html.classList.remove('by-lock');document.body.classList.remove('by-lock');document.body.style.top='';scrollTo(0,savedY)}
function openW(){isOpen=true;P.classList.add('active');L.classList.add('hidden');$('launcherBadge').style.display='none';
  if(!opened){opened=true;opening()}if(mobile()&&!PV)lock();setTimeout(()=>$('inp').focus(),240)}
function closeW(){isOpen=false;P.classList.remove('active');L.classList.remove('hidden');if(mobile()&&!PV)unlock()}
$('launcherBtn').onclick=$('livePill').onclick=e=>{e.preventDefault();openW()};$('closeBtn').onclick=e=>{e.preventDefault();closeW()};
addEventListener('resize',()=>{if(!mobile()&&document.body.classList.contains('by-lock'))unlock()});
P.addEventListener('touchmove',e=>{if(!PV&&mobile()&&!e.target.closest('.msgs,.tour-scroll,.subhdr'))e.preventDefault()},{passive:false});

/* markdown */
function md(raw){let h=String(raw).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/^#{1,3} (.+)$/gm,'<h3>$1</h3>').replace(/^---+$/gm,'<hr>').replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/__(.+?)__/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/_(.+?)_/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(?<!["\(>])(https?:\/\/[^\s<"'\)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,b=>'<ul>'+b+'</ul>').replace(/^\d+\. (.+)$/gm,'<oli>$1</oli>').replace(/(<oli>.*<\/oli>\n?)+/g,b=>'<ol>'+b.replace(/<\/?oli>/g,t=>t==='<oli>'?'<li>':'</li>')+'</ol>');
  return h.replace(/\n{2,}/g,'\n\n').split('\n\n').map(l=>{const t=l.trim();return!t?'':/^<(h[1-3]|ul|ol|blockquote|hr|li)/.test(t)?t:'<p>'+t.replace(/\n/g,'<br>')+'</p>'}).filter(Boolean).join('\n')}

/* messages */
const scrollB=()=>{const e=$('msgs');setTimeout(()=>{e.scrollTop=e.scrollHeight},40)};
function setBusy(v){busy=v;$('send-btn').disabled=v;$('inp').disabled=v;P.querySelectorAll('.opt-pill').forEach(b=>b.disabled=v)}
const agentRow=()=>'<div class="agent-row"><div class="agent-row-av">'+avatar()+'</div><span class="agent-row-name">'+esc(C.agentTag)+'</span><span class="agent-row-badge">'+esc(C.aiBadge)+'</span><span class="agent-row-time">'+time()+'</span></div>';
function group(inner,id){const g=document.createElement('div');g.className='msg-group';if(id)g.id=id;g.innerHTML=inner;$('msgs').appendChild(g);wire(g);scrollB();return g}
function options(list,id){const w=document.createElement('div');w.className='options-wrap';w.id=id;
  list.forEach(t=>{const b=document.createElement('button');b.className='opt-pill';b.textContent=t;b.onclick=()=>{w.remove();sendMessage(t)};w.appendChild(b)});$('msgs').appendChild(w)}
function opening(){const m=$('msgs');m.innerHTML='';const d=document.createElement('div');d.className='date-pill';d.textContent=new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});m.appendChild(d);
  group(agentRow()+'<div class="msg"><div class="bub b">'+md(C.welcomeMessage)+'</div></div>');if(C.starterOptions.length)options(C.starterOptions,'starters');scrollB()}
function userMsg(t){hasUser=true;group('<div style="display:flex;justify-content:flex-end;margin-bottom:4px"><span style="font-size:10px;color:var(--muted);margin-right:4px">'+time()+'</span></div><div class="msg u"><div class="u-av">'+esc(C.youLabel)+'</div><div class="bub u">'+esc(t)+'</div></div>')}
function typing(){const id='ty'+Date.now();group(agentRow()+'<div class="msg"><div class="tdots"><div class="d"></div><div class="d"></div><div class="d"></div></div></div>',id);return id}
function botMsg(t,opts){group(agentRow()+'<div class="msg"><div class="bub b">'+md(t)+'</div></div>');if(Array.isArray(opts)&&opts.length){options(opts,'o'+Date.now());scrollB()}}
function errMsg(){group(agentRow()+'<div class="msg"><div class="bub err">'+esc(C.errorText)+'<br><button class="retry-btn" data-act="retry">'+esc(C.retryText)+'</button></div></div>')}

/* tours */
function tourCards(list){if(!Array.isArray(list)||!list.length)return;
  group(agentRow()+'<div class="tour-scroll">'+list.map((t,i)=>{const k='t'+Date.now()+'_'+i;reg[k]=t;
    const img=t.image?'<img src="'+esc(t.image)+'" alt="'+esc(t.title||'')+'">':'<div class="no-photo">No photo available</div>',pr=t.price?C.currency+t.price:'Enquire';
    return '<div class="tour-card"><div class="tour-img-wrap">'+img+(t.duration?'<div class="tour-badge">'+esc(t.duration)+'</div>':'')+(t.from?'<div class="tour-from-badge">'+esc(t.from)+'</div>':'')+'</div><div class="tour-body">'+(t.title?'<div class="tour-title">'+esc(t.title)+'</div>':'')+'<div class="tour-price">'+esc(pr)+(t.price?'<span> pp</span>':'')+'</div><div class="tour-actions"><button class="tour-btn details" data-act="details" data-key="'+k+'">'+esc(C.detailsText)+'</button><button class="tour-btn book" data-act="book" data-key="'+k+'">'+esc(C.bookText)+'</button></div></div></div>'}).join('')+'</div>')}
function tourModal(k){const t=reg[k];if(!t)return;closeModal();const o=document.createElement('div');o.id='tm';o.className='tour-modal-overlay';o.dataset.act='overlay';
  const img=t.image?'<img class="tour-modal-img" src="'+esc(t.image)+'" alt="">':'<div class="tour-modal-img no-photo">No photo available</div>',pr=t.price?C.currency+t.price:'Enquire for price';
  o.innerHTML='<div class="tour-modal"><div class="tour-modal-img-wrap">'+img+'<button class="tour-modal-close" data-act="close-modal" aria-label="Close">✕</button></div><div class="tour-modal-body">'+(t.title?'<div class="tour-modal-title">'+esc(t.title)+'</div>':'')+(t.description?'<div class="tour-modal-desc">'+esc(t.description)+'</div>':'')+'<div class="tour-modal-price">'+esc(pr)+(t.price?'<span> pp</span>':'')+'</div><div class="tour-modal-meta">'+(t.duration?'<span>'+esc(t.duration)+'</span>':'')+(t.from?'<span>'+esc(t.from)+'</span>':'')+'</div><button class="tour-modal-book" data-act="book" data-key="'+k+'">'+esc(C.bookText)+'</button></div></div>';
  P.appendChild(o);wire(o)}
const closeModal=()=>{const e=$('tm');if(e)e.remove()};

/* booking */
function bookingCard(name){const old=$('bk');if(old)old.remove();trip=name||'';
  const pk=C.pickupPoints.length?'<select class="ck-select" id="bk-pickup"><option value="" disabled selected>Pickup Point</option>'+C.pickupPoints.map(p=>'<option>'+esc(p)+'</option>').join('')+'</select>':'';
  group(agentRow()+'<div class="card-wrap"><div class="card"><div class="card-hdr"><div class="card-hdr-title">'+esc(C.bookingTitle)+'</div><div class="card-hdr-sub">'+(name?esc(name):"We'll confirm availability by email")+'</div></div><div class="card-fields"><input class="ck-input" type="text" id="bk-name" placeholder="Full Name" autocomplete="name"><input class="ck-input" type="email" id="bk-email" placeholder="Email Address" autocomplete="email"><input class="ck-input" type="tel" id="bk-phone" placeholder="Phone Number" autocomplete="tel"><select class="ck-select" id="bk-trav"><option value="" disabled selected>Number of Travellers</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select>'+pk+'<div id="bk-error" class="ck-error"></div></div><div class="ck-divider"></div><div style="padding:14px 14px 0"><button class="ck-submit-btn" id="bk-btn" data-act="submit"><div class="spinner"></div><span>Confirm Booking Request</span></button></div><div class="ck-footer">Your details are sent securely to our booking team</div></div></div>','bk')}
async function submitBooking(){const v=id=>{const e=$(id);return e?e.value.trim():''},name=v('bk-name'),email=v('bk-email'),phone=v('bk-phone'),trav=v('bk-trav'),pick=v('bk-pickup'),er=$('bk-error');
  if(!name)return er.textContent='Please enter your full name.';if(!email||!email.includes('@'))return er.textContent='Please enter a valid email address.';
  if(!phone)return er.textContent='Please enter a contact phone number.';if(!trav)return er.textContent='Please select the number of travellers.';
  if($('bk-pickup')&&!pick)return er.textContent='Please select a pickup point.';er.textContent='';
  const b=$('bk-btn');b.disabled=true;b.classList.add('loading');
  try{let d={};if(!PV){const r=await fetch(C.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit_booking',botId:BOT,trip,name,email,phone,travellers:trav,pickup:pick,sessionId:SID})});
      if(!r.ok)throw new Error('Could not send your booking request. Please try again.');d=await r.json().catch(()=>({}))}
    $('bk').remove();success(name,email,trip,d.reference)}
  catch(e){er.textContent=e.message||'Something went wrong. Please try again.';b.disabled=false;b.classList.remove('loading')}}
function success(name,email,tr,ref){const r=ref?String(ref).slice(-8).toUpperCase():Math.random().toString(36).slice(2,8).toUpperCase();
  group(agentRow()+'<div class="msg"><div class="success-bub"><div class="success-title">Booking Request Sent, '+esc(name.split(' ')[0])+'!</div><div class="success-msg">We\'ve received your request'+(tr?' for <strong>'+esc(tr)+'</strong>':'')+'. Our team will confirm availability and send payment details to <strong>'+esc(email)+'</strong> shortly.</div><div class="success-ref">Ref: #'+r+'</div></div></div>')}

/* send */
function send(){const i=$('inp'),t=i.value.trim();if(!t||busy)return;i.value='';i.focus();sendMessage(t)}
$('send-btn').onclick=send;$('inp').onkeydown=e=>{if(e.key==='Enter'&&!busy)send()};
async function sendMessage(txt){if(busy)return;last=txt;setBusy(true);userMsg(txt);const tid=typing();
  try{if(!C.webhookUrl)throw 0;
    const r=await fetch(C.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt,source:C.source,botId:BOT,sessionId:SID,action:'chat'})});
    if(!r.ok)throw 0;const d=await r.json();$(tid)&&$(tid).remove();
    const reply=d.message||d.reply||d.output||d.text||"Thanks for reaching out — I've got your message.";
    botMsg(reply.replace(/\[show_tours\]/gi,'').replace(/\[show_booking\]/gi,'').trim(),d.buttons);
    const wt=d.action==='show_tours'||/\[show_tours\]/i.test(reply),wb=d.action==='show_booking'||/\[show_booking\]/i.test(reply)||/^i want to book:/i.test(txt);
    const tours=Array.isArray(d.tours)&&d.tours.length?d.tours:(wt?C.tours:null);
    if(tours)setTimeout(()=>tourCards(tours),700);if(wb)setTimeout(()=>bookingCard(txt.replace(/^i want to book:\s*/i,'')),700)}
  catch(e){$(tid)&&$(tid).remove();errMsg()}finally{setBusy(false);$('inp').focus()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  switch(t.dataset.act){case'retry':if(last&&!busy){P.querySelectorAll('.bub.err').forEach(x=>{const g=x.closest('.msg-group');g&&g.remove()});sendMessage(last)}break;
    case'details':tourModal(t.dataset.key);break;
    case'book':{closeModal();const o=reg[t.dataset.key];sendMessage('I want to book: '+((o&&o.title)||'this trip'));break}
    case'close-modal':closeModal();break;case'overlay':if(e.target===t)closeModal();break;case'submit':submitBooking();break}});

/* dashboard preview */
function reset(){reg={};hasUser=false;closeModal();opening();const f=(C.tours[0]&&C.tours[0].title)||'';
  if(scenario==='tours')tourCards(C.tours);if(scenario==='booking')bookingCard(f);if(scenario==='success')success('Sarah Jones','sarah@example.com',f,'')}
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;
  if(d.by===1&&d.type==='layout'&&e.source===parent){html.classList.toggle('mob',!!d.mobile);return}
  if(!PV||d.by!=='dash')return;
  if(d.type==='config'){C=merge(d.config);apply();if(isOpen&&!hasUser)reset()}
  else if(d.type==='scenario'){scenario=d.name;if(isOpen)reset()}
  else if(d.type==='state'){if(d.open){opened=true;if(!isOpen){isOpen=true;P.classList.add('active');L.classList.add('hidden')}reset()}else closeW()}});

/* init */
async function init(){
  if(PV){apply();try{parent.postMessage({by:1,type:'ready'},'*')}catch(e){}return}
  if(!BOT||!API||API.indexOf('PASTE_')===0){L.style.display='none';P.style.display='none';return}
  const ck='by_cfg_'+BOT;let cs='',cached=null;
  try{cs=localStorage.getItem(ck)||'';cached=cs?JSON.parse(cs):null}catch(e){}
  if(cached){C=merge(cached);apply()}
  try{const r=await fetch(API+'?botId='+encodeURIComponent(BOT)+'&host='+encodeURIComponent(location.hostname)),d=await r.json();
    if(!d.ok){try{localStorage.removeItem(ck)}catch(e){}L.style.display='none';P.style.display='none';return}
    const fresh=JSON.stringify(d.config);if(fresh!==cs){C=merge(d.config);apply();if(isOpen&&!hasUser)opening();try{localStorage.setItem(ck,fresh)}catch(e){}}}
  catch(e){if(!cached){L.style.display='none';P.style.display='none'}}
}
init().then(()=>{if(!PV&&C.autoOpenSec>0)setTimeout(()=>{if(!isOpen&&!opened)openW()},C.autoOpenSec*1000)});
})();
</script>
</body></html>
